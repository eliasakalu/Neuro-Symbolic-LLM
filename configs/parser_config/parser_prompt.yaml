parser:
  shared_extraction_guidance: |
    Roles and participants
    - Determine argument roles from meaning, not surface word order. Active and
      passive descriptions of the same event keep the same participants and
      roles. Do not invent an agent for an agentless passive.
    - In a passive sentence, a by-phrase names the agent of the same action;
      it does not create a second action.
    - An intentional actor is an agent. A participant that undergoes a change,
      failure, recovery or stop is a patient. "The door opened" has an affected
      door and no stated agent; "It rained" has no participant at all.
    - Keep every explicitly stated core participant and every distinct event.
      Do not turn an event into a persistent relation because it is passive or
      has a lasting result.

    References
    - Resolve a pronoun, a shared subject or an omitted argument only when one
      antecedent is clearly supported. Then reuse that entity's ID instead of
      creating a new entity.
      "Alice opened the door and entered" shares Alice.
      "Although the medicine reduced pain, it did not cure the disease": "it"
      is the medicine.
      "Alice met Mary. She entered" does not say which woman; keep the
      ambiguity in alternatives instead of guessing.
    - Weather subjects such as "it" in "it rains" are not participants.
    - Resolve references in the extraction, but never rewrite the source
      inside a quote.

    Negation
    - Mark explicit negation with polarity "negative" on the assertion it
      modifies. Keep it on that clause only; never move it to another clause.
    - Its evidence must include the negation words of the source.
    - Uncertainty, questions, wishes and missing information are not negation.
      Passive voice is not negation: "was closed" is positive, "was not closed"
      is negative.

    Factuality and modality
    - Factuality says how the source presents a claim, not how sure you are.
      A stated fact is asserted. A stated belief or judgement is opinion.
      An uncertain possibility is speculative. Content inside an explicit
      condition is hypothetical, even when it contains may or might.
    - Reported beliefs do not make their content a fact. Secondary relations
      share the factuality of the event they belong to unless the source says
      otherwise.
    - Modality is only for duties and permissions. Must and shall express
      obligation. May expresses permission only when it grants authorization:
      "The Buyer may terminate the contract." When may or might says that
      something could be true or could happen, use speculative factuality and
      modality none: "It may rain tomorrow." If both readings fit, choose the
      more likely one and put the other in alternatives.
    - "May not" and "shall not" use negative polarity with their modality.

    Numbers, time and place
    - Keep numbers, units, dates and counted objects exactly as written. Do not
      convert units or drop a quantity to fit a predicate.
    - A duration is not a clock time, and an event is not a date. A purpose is
      not evidence that the intended action happened. A condition is neither a
      date nor proof of a cause.
    - Time and place add to the core event; they never replace it. Tell the
      place where an event happens apart from where an entity usually is.
    - Keep temporal order in arguments: earlier before later, and the contained
      event before the containing interval for "during".

    Clauses
    - Keep subordinate, relative, coordinated and embedded propositions as
      separate propositions; do not merge them into one assertion.
